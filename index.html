  <title>Rock'n Ride Cars</title>

  <meta
    name="description"
    content="A high-speed 3D car simulator for mobile and computer, with local multiplayer, gears, nitro and multiple cameras."

<body>

  <main class="game-shell">

    <div
      class="game-canvas"
      aria-label="3D night city racing game">
      <canvas
        data-engine="three.js r185">
      </canvas>
    </div>

    <header class="topbar">
      <div class="brand">
        <span>ROCK'N RIDE</span> <b>CARS</b>
      </div>

      <div class="live-pill">
        <i></i> LOCAL RACE
      </div>

      <div class="top-actions">
        <button class="icon-button" aria-label="Fullscreen">
          ⛶
        </button>

        <button class="icon-button" aria-label="Pause">
          Ⅱ
        </button>
      </div>
    </header>

    <section class="menu-card">

      <p class="eyebrow">
        NO DOWNLOAD • INSTANT RACING
      </p>

      <h1>
        OWN THE <em>NIGHT</em>
      </h1>

      <p class="intro">
        High-speed 3D street racing for mobile and computer.
        Race rivals, hit checkpoints, shift gears and burn nitro.
      </p>

      <div class="setup-grid">

        <div class="setting">
          <label>RACE MODE</label>

          <div class="segmented">
            <button class="active">SOLO</button>
            <button>2 PLAYERS</button>
          </div>
        </div>

        <div class="setting">
          <label>TRANSMISSION</label>

          <div class="segmented">
            <button class="active">AUTO</button>
            <button>MANUAL</button>
          </div>
        </div>

        <div class="setting paint-setting">
          <label>CAR PAINT</label>

          <div class="paint-row">
            <button
              aria-label="Choose #ff3b30 car"
              class="selected"
              style="background:#ff3b30">
            </button>

            <button
              aria-label="Choose #38f7c0 car"
              style="background:#38f7c0">
            </button>

            <button
              aria-label="Choose #2c7cff car"
              style="background:#2c7cff">
            </button>

            <button
              aria-label="Choose #ffbf35 car"
              style="background:#ffbf35">
            </button>

            <button
              aria-label="Choose #f7f7fb car"
              style="background:#f7f7fb">
            </button>
          </div>
        </div>

      </div>

      <button class="start-button">
        START ENGINE<span>›</span>
      </button>

      <div class="controls-help">
        <p>
          <b>P1</b>
          W/S accelerate &amp; brake • A/D steer • Shift nitro
        </p>

        <p>
          C camera • Automatic gears • Esc pause
        </p>
      </div>

    </section>

    <div class="scanlines"></div>
